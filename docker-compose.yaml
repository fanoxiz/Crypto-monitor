services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: crypto_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crypto_user", "-d", "crypto_db"]
      interval: 2s
      timeout: 5s
      retries: 5

  executor:
    build: 
      context: .
      dockerfile: executor/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://crypto_user:secret_password@postgres_db:5432/crypto_db
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/stats || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - EXECUTOR_URL=http://executor:8082/deals
      - REDIS_ADDR=redis:6379
    depends_on:
      executor:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  fetcher:
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    environment:
      - ANALYZER_URL=http://analyzer:8081/prices
    depends_on:
      analyzer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
