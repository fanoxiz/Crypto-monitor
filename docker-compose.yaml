version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: crypto_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crypto_user", "-d", "crypto_db"]
      interval: 2s
      timeout: 5s
      retries: 5

  executor:
    build: 
      context: .
      dockerfile: executor/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://crypto_user:secret_password@postgres_db:5432/crypto_db
    depends_on:
      postgres_db:
        condition: service_healthy

  analyzer:
    build:
      context: .
      dockerfile: analyzer/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - EXECUTOR_URL=http://executor:8082/deals
    depends_on:
      - executor

  fetcher:
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    environment:
      - ANALYZER_URL=http://analyzer:8081/prices
    depends_on:
      - analyzer
