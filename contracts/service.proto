syntax = "proto3";

package contracts;

option go_package = "github.com/fanoxiz/crypto-monitor/contracts/grpcpb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

message ProfitDealInfo {
  string coin = 1;
  string buy_exchange = 2;
  string sell_exchange = 3;
  double buy_amount_usdt = 4;
  double sell_amount_usdt = 5;
  double profit_usdt = 6;
  google.protobuf.Timestamp detected_at = 7;
}

service ExecutorService {
  rpc ProcessDeal(ProfitDealInfo) returns (google.protobuf.Empty);
}
